name: Deploy to Pages

# 이 템플릿으로 만든 사용자 저장소의 main에 push될 때 배포합니다.
# 템플릿 원본 저장소에서는 아래 job 조건에 따라 실행하지 않습니다.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.repository != 'kitturamiboiler/Portfolio-Template'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22          # package.json engines: >=22.13.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        run: npm run build:pages    # _site/ 생성

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true          # Pages 사이트가 없으면 직접 생성

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site             # 빌드 산출물만 업로드

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
